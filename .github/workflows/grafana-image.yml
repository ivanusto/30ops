name: grafana-image

# Builds collector/grafana/Dockerfile for amd64 and arm64 and pushes it to
# ghcr.io/ivanusto/30ops-grafana with a build provenance attestation. The
# digest it prints is what collector/compose.yml pins; a new digest goes
# into compose.yml in its own commit.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [collector/grafana/Dockerfile]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ivanusto/30ops-grafana
  TAG: 12.2.10-vlogs0.32.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: collector/grafana
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          provenance: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: digest for compose.yml
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "image: ${IMAGE}:${TAG}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
