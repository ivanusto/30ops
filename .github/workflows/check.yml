name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # release.yml

permissions:
  contents: read

env:
  PROMETHEUS_VERSION: "3.5.0"
  PROMETHEUS_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
  ALERTMANAGER_VERSION: "0.28.1"
  ALERTMANAGER_SHA256: 5ac7ab5e4b8ee5ce4d8fb0988f9cb275efcc3f181b4b408179fafee121693311
  SNMP_EXPORTER_VERSION: "0.29.0"
  SNMP_EXPORTER_SHA256: fd7ded886180063a8f77e1ca18cc648e44b318b9c92bcb3867b817d93a5232d6

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/hygiene.py
      - run: python3 scripts/check-drift.py
      - run: sh scripts/check-ci-pins.sh
      - run: shellcheck -s sh scripts/*.sh

  lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y -qq python3-yaml
      - run: python3 -W error -m unittest discover -s tests/unit -v
      - run: python3 -m unittest tests/test_golden.py -v
      - run: python3 -W error -m unittest tests/test_render.py -v
      - name: render the sample site and check the units and sudoers it writes
        run: |
          bin/30ops validate --site examples/sample-site/site.yaml --strict
          bin/30ops render --site examples/sample-site/site.yaml --out build
          bin/30ops render --site examples/sample-site/site.yaml --compare-legacy tests/fixtures/legacy-root
          systemd-analyze verify build/etc/systemd/system/mnt-worm.mount
          for f in build/nodes/*/etc/sudoers.d/pcap; do sudo visudo -cf "$f"; done
      - run: shellcheck -s sh bin/30ops lib/sh/ops30.sh adapters/nas/qnap/remote.sh tests/vm/run.sh tests/vm/state.sh tests/vm/e2e.sh tests/sh/test_ops30_sh.sh scripts/fetch-legacy.sh tests/sh/test_fetch_legacy.sh tests/sh/test_dist.sh
      - run: shellcheck -s sh tests/e2e/run.sh tests/e2e/fakes/netns.sh tests/fakes/changes-repo.sh tests/fakes/qnap/bin/*
      - run: sh tests/sh/test_ops30_sh.sh
      - run: sh tests/sh/test_fetch_legacy.sh
      - run: sh tests/sh/test_dist.sh

  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: promtool
        run: |
          curl -fsSL -o p.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  p.tgz" | sha256sum -c
          tar xzf p.tgz && sudo install -m 0755 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
      - run: shellcheck textfile/nas-textfile.sh textfile/pve-quorum-textfile.sh verify.sh install-node.sh node/node-install.sh tests/fake-nas.sh tests/compose-smoke.sh grafana/build.sh
      - name: render the sample site
        run: |
          sudo apt-get install -y -qq python3-yaml
          ../bin/30ops render --site ../examples/sample-site/site.yaml --out ../build
      - run: promtool check config ../build/etc/30ops/prometheus/prometheus.yml
      - name: promtool check and test the rendered rules
        run: sh ../scripts/test-rules.sh
      - name: amtool check-config
        run: |
          curl -fsSL -o a.tgz "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz"
          echo "${ALERTMANAGER_SHA256}  a.tgz" | sha256sum -c
          tar xzf a.tgz && "./alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool" check-config alertmanager/alertmanager.base.yml
          "./alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool" check-config ../build/etc/30ops/alertmanager/alertmanager.yml
      - run: python3 grafana/build-dashboard.py --check
      - name: snmp_exporter dry-run
        run: |
          curl -fsSL -o s.tgz "https://github.com/prometheus/snmp_exporter/releases/download/v${SNMP_EXPORTER_VERSION}/snmp_exporter-${SNMP_EXPORTER_VERSION}.linux-amd64.tar.gz"
          echo "${SNMP_EXPORTER_SHA256}  s.tgz" | sha256sum -c
          tar xzf s.tgz
          "./snmp_exporter-${SNMP_EXPORTER_VERSION}.linux-amd64/snmp_exporter" --config.file=prometheus/snmp.yml --config.file=../build/etc/30ops/prometheus/snmp-auth.yml --dry-run
      - run: python3 -m unittest discover -s tests -v
      - run: sh tests/fake-nas.sh
      - name: compose config on the rendered sample site
        run: docker compose --env-file ../build/etc/30ops/compose.env -f compose.yml config -q
      - name: compose smoke (the merged stack on the rendered sample site)
        run: sh tests/compose-smoke.sh

  logs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -s sh archive/*.sh node/*.sh collector/*.sh firewall/*.sh pcap/*.sh tests/*.sh
      - run: python3 -m py_compile firewall/fw-report.py firewall/aup-report.py firewall/fortigate-export-load.py pcap/pcap-stat.py audit/audit-report.py
      - run: systemd-analyze verify pcap/pcap@.service || true   # the runner has no /etc/pcap/*.env
      - run: sudo visudo -cf pcap/sudoers-pcap
      - name: smoke (VictoriaLogs in docker, syslog + journald in, archive + verify out)
        run: sh tests/smoke.sh
      - name: smoke-firewall
        run: sh tests/smoke-firewall.sh
      - name: smoke-pcap
        run: sudo apt-get install -y -qq tcpdump && sudo sh tests/smoke-pcap.sh
      - name: smoke-aup
        run: sh tests/smoke-aup.sh
      - name: smoke-audit
        run: sh tests/smoke-audit.sh

  changes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check.py --assets ../examples/sample-site/assets.tsv
      - run: python3 scripts/render.py --check
      - run: shellcheck -s sh scripts/change-mark.sh drills/drill.sh tests/smoke-change-mark.sh tests/test_drill.sh
      - run: sh tests/smoke-change-mark.sh
      - run: sh tests/test_drill.sh
      - run: python3 -m unittest discover -s tests -v

  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -W error -m unittest discover -s tests -v
      - run: shellcheck -s sh tests/smoke-gatectl.sh tests/smoke-mcp.sh tests/fixtures/fake-ssh tests/fixtures/fake-logger
      - run: sh tests/smoke-gatectl.sh
      - run: sh tests/smoke-mcp.sh
      - run: python3 -c "import json; json.load(open('tools.json')); json.load(open('config.json.example'))"

  drills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pve-backup
        working-directory: drills/pve-backup
        run: shellcheck canary.sh restore-drill.sh tests/fake-flow.sh && sh tests/fake-flow.sh
      - name: nas-backup
        working-directory: drills/nas-backup
        run: shellcheck nas-audit.sh share-canary.sh replica-verify.sh restore-drill.sh tests/fake-flow.sh && sh tests/fake-flow.sh
      - name: cloud-offload
        working-directory: drills/cloud-offload
        run: shellcheck gcs-bucket.sh s3-bucket.sh offload-drill.sh tests/fake-flow.sh && python3 -m unittest discover -s tests && sh tests/fake-flow.sh
      - name: qdevice
        working-directory: checks/qdevice
        run: shellcheck setup.sh check.sh record.sh

  plugins-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y -qq python3-yaml
      - name: nfs-model-library
        working-directory: plugins/nfs-model-library
        run: python3 -m py_compile mlib.py && python3 -m unittest discover -s tests -v
      - name: gb10-ops
        working-directory: plugins/gb10-ops
        run: |
          python3 -m compileall -q guards samplers bench
          bash -n examples/train-guarded.sh
          for f in guards/*.py samplers/*.py bench/*.py; do python3 "$f" --help > /dev/null; done
          systemd-analyze verify systemd/gb10-host-guard.service
          for f in guards/*.py samplers/*.py bench/*.py examples/*.sh; do [ -x "$f" ] || { echo "not executable: $f"; exit 1; }; done
      - name: spark-baseline
        working-directory: plugins/spark-baseline
        run: shellcheck -s sh ./*.sh
      - name: inventory
        working-directory: inventory
        run: python3 -m unittest discover -s tests -v && python3 cost.py --check
