# The plugin contract (docs/plugins.md).
plugin: 1
name: spark-baseline
version: 1
license: Apache-2.0
summary: Plain-text state snapshots of a GPU node and an SSH hardening drop-in that refuses to lock you out
roles: [node]
vendors: [linux]
# the node bundle carries these files (paths in this directory) and
# node-install.sh runs install.sh from them, after the host's roles
install:
  files: [install.sh, baseline-snapshot.sh]
readiness:
  - id: snapshot
    category: node-guard
    question:
      zh-TW: 每台節點都有近期的 baseline-snapshot，存在私有 repo 裡嗎？
      en: Does every node have a recent baseline-snapshot, kept in a private repository?
    check: {type: manual, hint: "where the snapshots are kept and the date of the newest"}
