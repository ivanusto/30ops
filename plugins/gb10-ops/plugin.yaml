# The plugin contract (docs/plugins.md). Every key below is read by 30ops;
# tests/unit/test_plugins.py checks the file against the directory.
plugin: 1
name: gb10-ops
version: 1
license: Apache-2.0
summary: Thermal soak and unified memory guards for NVIDIA DGX Spark (GB10) nodes, with their metrics
# a host may list the plugin when it has one of these roles and this vendor
roles: [node]
vendors: [linux]
# the node bundle carries these files (paths in this directory) and
# node-install.sh runs install.sh from them, after the host's roles
install:
  files: [install.sh, textfile/gb10-textfile.py, systemd/gb10-textfile.service, systemd/gb10-textfile.timer]
# what the node writes; max_age_s is the threshold of its stale alert
textfile:
  - {file: gb10.prom, prefix: gb10_textfile, max_age_s: 120}
# The hosts that list the plugin are scraped by this job instead of the
# node job (replaces: node), at <address>:<port>. 15 s so a 240 s soak
# budget is seen as 16 samples, not 4.
scrape:
  job: gb10
  port: 9100
  replaces: node
  config:
    scrape_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: node
        replacement: "$1"
rules: [rules/gb10.yml]
thresholds: thresholds.yml
# pairs that must stay in order: lower, higher
threshold_order:
  - [gb10_mem_crit_gib, gb10_mem_warn_gib]
# rows(h, y, th) -> (panels, y): drawn after the first dashboard row
dashboard: dashboard.py
# readiness items (checks/readiness/checklist.yaml form), asked when a host
# lists the plugin; their ids become gb10-ops:<id>
readiness:
  - id: textfile-fresh
    category: node-guard
    question:
      zh-TW: 每台 GB10 的 gb10-textfile 都在兩分鐘內更新嗎？
      en: Has gb10-textfile run within two minutes on every GB10 node?
    check: {type: promql, ok: 'gb10_textfile_last_run_timestamp', bad: 'time() - gb10_textfile_last_run_timestamp > 120', show: instance}
  - id: host-guard
    category: node-guard
    question:
      zh-TW: 每台 GB10 都跑著 gb10-host-guard（記憶體耗盡前終止程序）嗎？
      en: Does gb10-host-guard (which ends a process before memory runs out) run on every GB10 node?
    check: {type: manual, hint: "systemctl is-active gb10-host-guard on each node, and the date checked"}
