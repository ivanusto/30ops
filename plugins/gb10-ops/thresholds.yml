# The gb10-ops plugin's thresholds, in the form of
# collector/prometheus/thresholds.yml. A site overrides them in site.yaml
# alerting.thresholds like any other.
gb10_soak_warn_s:
  default: 180
  unit: s
  alerts: [Gb10SoakNearBudget]
  help: seconds the hottest zone has been above its limit; the guard acts at 240
gb10_mem_warn_gib:
  default: 6
  unit: GiB
  alerts: [Gb10MemAvailableLow]
  help: MemAvailable warning line (the gb10-ops guard warns at 6 GiB)
gb10_mem_crit_gib:
  default: 3
  unit: GiB
  alerts: [Gb10MemAvailableCritical]
  help: MemAvailable critical line (the gb10-ops guard acts at 3 GiB)
