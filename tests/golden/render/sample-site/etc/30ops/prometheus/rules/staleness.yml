# generated by 30ops X.Y.Z from site.yaml sha256:e64197fdb2465be61801358aafb2b954975953321dc76fc39c011e6ec10860bc; do not edit
# Is the pipeline alive. Thresholds on the numbers themselves (soak, pool
# capacity, drill age) are in thresholds.yml. docs/rules.md explains each.
groups:
  # Always firing. Alertmanager sends it every minute to the deadman
  # receiver only (site.yaml alerting.deadman): 30ops-deadman on another
  # host, or an external check URL, raises the alarm when the pushes stop,
  # which is the one failure the collector cannot report itself (host,
  # Prometheus, rules or Alertmanager down). No instance label and severity
  # none, so no inhibit rule and no severity route catches it.
  - name: meta
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels: {severity: none}
        annotations: {summary: "always firing: the collector, its rules and its alert path are alive"}

  - name: pipeline
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.job }} {{ $labels.instance }} not scraped for 5m"}
      - alert: NasTextfileStale
        expr: time() - nas_textfile_last_run_timestamp > 600
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "nas-textfile for {{ $labels.nas }} is older than 10 minutes"}
      # When the NAS requires a higher security level than snmp-auth.yml asks
      # for (authPriv vs authNoPriv), the walk ends empty with HTTP 200: up
      # stays 1 and only the exporter's own snmp_scrape_* (5 samples) come
      # back. A wrong auth protocol fails the scrape instead (up 0).
      - alert: NasSnmpNoData
        expr: scrape_samples_scraped{job="nas-snmp"} < 50
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "SNMP on {{ $labels.instance }} returns no NAS data (check v3 auth and priv settings)"}
      - alert: NasUnreachable
        expr: nas_up == 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "ssh or zfs failed on {{ $labels.nas }}"}
      - alert: DrillsTextfileStale
        expr: time() - drills_textfile_last_run_timestamp > 7200
        for: 10m
        labels: {severity: info}
        annotations: {summary: "drills-textfile older than 2 hours"}
      # pve-quorum-textfile runs from the collector's cron every minute.
      - alert: PveQuorumTextfileStale
        expr: time() - pve_quorum_textfile_last_run_timestamp > 300
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "pve-quorum-textfile has not run for 5 minutes, vote metrics are stale"}
      # 30ops readiness runs from the collector's cron every 15 minutes.
      - alert: ReadinessTextfileStale
        expr: time() - readiness_textfile_last_run_timestamp > 3600
        for: 10m
        labels: {severity: info}
        annotations: {summary: "readiness.prom is older than an hour (30ops readiness --plan in the collector's cron)"}
