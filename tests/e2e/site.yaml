# The e2e site: the sample site cut down to what tests/e2e/fakes can stand
# in for, with the same vendors and addresses. The collector is the test
# host itself (192.0.2.49 on the fake LAN's veth); everything else lives in
# the ops30e2e network namespace. Not covered here: the gb10 nodes, the
# agent gate, pcap and plugins (docs/e2e.md).
version: 1

site:
  id: e2e
  name: 30ops e2e
  timezone: Asia/Taipei
  locale: en

collector:
  host: collector

credentials:
  pve-exporter: {file: /etc/30ops/secrets/pve-exporter.token}
  snmp-auth: {file: /etc/30ops/secrets/snmp-auth.pass}
  snmp-priv: {file: /etc/30ops/secrets/snmp-priv.pass}
  fortigate-api: {file: /etc/30ops/secrets/fortigate-api.token}

hosts:
  - name: collector
    address: 192.0.2.49
    vendor: linux
    roles: [collector, journal]

  - name: pve1
    address: 192.0.2.9
    vendor: pve
    roles: [hypervisor]
    ssh: {user: root}
    pve: {cluster: lab}
  - name: pve2
    address: 192.0.2.5
    vendor: pve
    roles: [hypervisor]
    ssh: {user: root}
    pve: {cluster: lab}

  - name: nas-primary
    address: 192.0.2.2
    vendor: qnap
    roles: [nas, syslog]
    labels: {nas: primary}
    ssh: {user: ops30}
    snmp: {auth: nas_v3}
    # the fake reports no UPS (qnap_ups_status -1), as the lab NAS do
    ups: none

  # a switch answering SNMPv3 with net-snmp's own IF-MIB (the generic-snmp adapter)
  - name: sw-core
    address: 192.0.2.40
    vendor: generic-snmp
    roles: [switch]
    snmp: {auth: nas_v3}

  # 30ops-deadman, installed from its node bundle on the test host and run
  # inside the namespace (run.sh adds NetworkNamespacePath); its journal
  # would be the test host's own, so it does not ship one
  - name: watcher
    address: 192.0.2.41
    vendor: linux
    roles: [deadman]
    journal: false

  - name: fgt-edge
    address: 192.0.2.99
    vendor: fortigate
    roles: [firewall, syslog, audit-source]
    syslog: {devname: fgt-edge}
    api: {url: "https://192.0.2.99:10443", token: fortigate-api, insecure: true}

pve:
  exporter: {user: prometheus@pve, token_name: exporter, token: pve-exporter, verify_ssl: false}

snmp:
  auths:
    nas_v3:
      username: ops30
      auth_protocol: SHA
      password: snmp-auth
      priv_protocol: AES
      priv_password: snmp-priv

# not /mnt/worm as on the sample site: a GitHub runner's /mnt is an fstab
# entry for a disk it may not have, and a failed mnt.mount fails every
# mount below /mnt (RequiresMountsFor)
worm:
  host: nas-primary
  export: /LogArchive
  mount: /srv/worm

logs:
  archive:
    skip: [syslog-fgt-edge]

alerting:
  receivers:
    ops-critical: {webhook: ["http://192.0.2.250:9999/ops-critical"]}
    ops-warning: {webhook: ["http://192.0.2.250:9999/ops-warning"]}
    ops-digest: {webhook: ["http://192.0.2.250:9999/ops-digest"], send_resolved: false}
  deadman:
    host: watcher
    after_s: 180          # the shortest allowed, so run.sh sees the silence alert sooner
    webhook: ["http://192.0.2.250:9999/deadman"]

assets: assets.tsv

changes:
  clone: /var/lib/30ops/changes
  remote: /srv/git/changes.git

# The items the fake LAN cannot answer, accepted with the reason; check.py
# readiness holds every item to the statuses it expects.
readiness:
  accept:
    pkg-rollback: a disposable test host, nothing to roll back to
    restore-drill-pve: the fake PVE nodes have no storage to restore to
    restore-drill-nas: the fake NAS has no shares to restore
    offsite-copy: no cloud bucket in the test
    backup-of-backup: no second NAS in the test
    eol: the fake FortiGate licence row has no date
    change-records: the fixture record is still scheduled after its window closed (ChangeWindowOverrun)
    second-approver: the fake change records are one person's
    change-effort: the fake change records predate effort_min
    audit-attributed: the test injects a FortiGate event that matches no change record
    rollback-drilled: the fake change records have no rollback drill
  answers:
    pkg-release-verified: e2e installs the tarball of the commit under test; run.sh prints its sha256
