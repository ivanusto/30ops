# The plugin is baked into the 30ops Grafana image (collector/grafana/Dockerfile).
# 30ops render installs this file only when the site collects logs.
apiVersion: 1
datasources:
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    editable: false
    jsonData:
      maxLines: 1000
