# The alert thresholds a site may change. The rule files in rules/ write
# them as ${key}; `30ops render` fills in alerting.thresholds from
# site.yaml, or the default below, and writes the result to
# /etc/30ops/prometheus/rules/. The dashboard (grafana/build-dashboard.py)
# draws its threshold lines from the same values.
#
# Only numbers a site has a reason to move are here. Staleness limits follow
# the product's own cron schedule and `for:` durations are part of what an
# alert means, so both stay fixed. Alert names do not follow the value
# (NasPoolAbove80 keeps its name at 85): Alertmanager's inhibit rules and
# the alert history refer to them by name.
#
# Each entry: default, unit, the alerts that use it, one line of help.
# docs/rules.md explains where each default came from.

# gb10-ops plugin
gb10_soak_warn_s:
  default: 180
  unit: s
  alerts: [Gb10SoakNearBudget]
  help: seconds the hottest zone has been above its limit; the guard acts at 240
gb10_mem_warn_gib:
  default: 6
  unit: GiB
  alerts: [Gb10MemAvailableLow]
  help: MemAvailable warning line (the gb10-ops guard warns at 6 GiB)
gb10_mem_crit_gib:
  default: 3
  unit: GiB
  alerts: [Gb10MemAvailableCritical]
  help: MemAvailable critical line (the gb10-ops guard acts at 3 GiB)

# NAS
nas_pool_warn_pct:
  default: 80
  unit: percent
  alerts: [NasPoolAbove80]
  help: ZFS pool capacity warning; ZFS slows down and fragments past 80 %
nas_pool_crit_pct:
  default: 90
  unit: percent
  alerts: [NasPoolAbove90]
  help: ZFS pool capacity critical
nas_disk_temp_c:
  default: 50
  unit: celsius
  alerts: [NasDiskHot]
  help: disk temperature, held for 15 minutes
nas_snapshot_max_age_days:
  default: 2
  unit: days
  alerts: [NasSnapshotStale]
  help: age of the newest snapshot of a dataset that has snapshots
nas_login_failures_warn:
  default: 10
  unit: count per hour
  alerts: [NasLoginFailures]
  help: failed NAS logins from one source in an hour, below the NAS's own ban
nas_login_failures_crit:
  default: 50
  unit: count per hour
  alerts: [NasLoginFailuresCritical]
  help: failed NAS logins from one source in an hour, the ban is not holding

# drills
drill_max_age_days:
  default: 30
  unit: days
  alerts: [DrillStale]
  help: time since the last passing PVE or NAS restore drill
cloud_drill_max_age_days:
  default: 90
  unit: days
  alerts: [CloudDrillStale]
  help: time since the last passing cloud offload drill
drill_rto_target_s:
  default: 900
  unit: s
  alerts: [DrillRtoOverTarget]
  help: recovery time target of a PVE restore drill

# asset lifecycle
eol_warn_days:
  default: 90
  unit: days
  alerts: [AssetEolWithin90Days]
  help: days before an end of support date that it becomes a warning
eol_crit_days:
  default: 30
  unit: days
  alerts: [AssetEolWithin30Days]
  help: days before an end of support date that it becomes critical
licence_warn_days:
  default: 90
  unit: days
  alerts: [AssetLicenceExpiring]
  help: days before a licence expires that it becomes a warning

# change records
change_overrun_min:
  default: 60
  unit: min
  alerts: [ChangeWindowOverrun]
  help: minutes after a change window closes with the record still open
change_soon_h:
  default: 24
  unit: h
  alerts: [ChangeStartsSoon]
  help: hours before a scheduled window that the digest mentions it
rollback_drill_max_age_days:
  default: 90
  unit: days
  alerts: [ChangeRollbackDrillStale]
  help: time since the rollback of a done record was last drilled

# agent gate, acceptable use, firewall
gate_denials_per_h:
  default: 5
  unit: count per hour
  alerts: [AgentGateDenials]
  help: agent gate denials in an hour
aup_blocked_burst:
  default: 20
  unit: count per hour
  alerts: [AupBlockedBurst]
  help: web filter blocks for one workstation in an hour
fw_burst_fortigate:
  default: 1200
  unit: count per hour
  alerts: [FwSourceBurst]
  help: packets one source had dropped by the FortiGate in an hour
fw_burst_ufw:
  default: 120
  unit: count per hour
  alerts: [FwSourceBurst]
  help: packets one source had dropped by ufw in an hour (ufw logs at most about 190)
fw_burst_pvefw:
  default: 600
  unit: count per hour
  alerts: [FwSourceBurst]
  help: packets one source had dropped by the PVE firewall in an hour
fw_burst_docker_user:
  default: 30
  unit: count per hour
  alerts: [FwSourceBurst]
  help: packets one source had dropped by the DOCKER-USER chain in an hour
