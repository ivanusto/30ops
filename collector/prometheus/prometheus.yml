# Prometheus for the 30ops collector. The job definitions are product;
# `30ops render` writes the site's copy to /etc/30ops/prometheus/ with the
# site label, the targets/*.yml of each job, and without the jobs the site
# has no targets for (victorialogs when it collects no logs), plus the jobs
# of the plugins its hosts list.
global:
  scrape_interval: 60s
  scrape_timeout: 10s
  evaluation_interval: 60s
  external_labels:
    site: onprem-lab

rule_files:
  - rules/*.yml

# Rules fire into Alertmanager on the compose network.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]

  # Alertmanager and Grafana health, so a dead alert path is itself an alert.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # A plugin's job (plugins/<name>/plugin.yaml scrape:) goes here, before
  # collector-host, when a host lists the plugin.

  # The host that runs nas-textfile.sh and drills-textfile.py exposes
  # them through its own node_exporter. One target, every NAS inside.
  - job_name: collector-host
    scrape_interval: 60s
    file_sd_configs:
      - files: [targets/collector.yml]

  # Proxmox VE via prometheus-pve-exporter (read-only API token).
  - job_name: pve
    scrape_interval: 60s
    metrics_path: /pve
    params:
      module: [default]
      cluster: ["1"]
      node: ["1"]
    file_sd_configs:
      - files: [targets/pve.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  # QNAP NAS over SNMP v3: hardware, pools, folders, SMART, fans, UPS,
  # services, apps, interface counters. snmp.yml is built from QTS-MIB
  # by snmp-build.py; auth lives in snmp-auth.yml.
  - job_name: nas-snmp
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /snmp
    params:
      module: [qnap]
      auth: [nas_v3]
    file_sd_configs:
      - files: [targets/nas-snmp.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  # 30ops-deadman on the deadman host (site.yaml alerting.deadman.host):
  # when the collector last pushed its Watchdog. A dead deadman host is
  # TargetDown like any other target.
  - job_name: deadman
    file_sd_configs:
      - files: [targets/deadman.yml]

  # The log store. The scratch image cannot run a healthcheck, so the
  # generic TargetDown rule on this job stands in for one.
  - job_name: victorialogs
    static_configs:
      - targets: ["victorialogs:9428"]
