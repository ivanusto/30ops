# Alerts on the numbers themselves. staleness.yml says whether the pipeline
# is alive; these say whether the site is. docs/rules.md explains each
# alert and where its threshold came from.
#
# A threshold the site may change is written as a dollar sign and its key
# in braces: 30ops render fills it in from site.yaml alerting.thresholds or
# the default in ../thresholds.yml.
#
# Rule groups inherit the global evaluation_interval (60 s in
# prometheus.yml). The gb10-ops plugin's rules are in
# plugins/gb10-ops/rules/.
#
# pve-exporter is scraped through both nodes and each one reports the
# whole cluster, so every pve_up series exists twice (instance .9 and .5).
# The pve rules aggregate the instance label away to alert once per object.
groups:
  - name: nas
    rules:
      - alert: NasPoolAbove80
        expr: nas_zpool_capacity_percent > ${nas_pool_warn_pct}
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.nas }} pool {{ $labels.pool }} at {{ $value }} %, warning line ${nas_pool_warn_pct} %"}
      - alert: NasPoolAbove90
        expr: nas_zpool_capacity_percent > ${nas_pool_crit_pct}
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.nas }} pool {{ $labels.pool }} at {{ $value }} %"}
      - alert: NasPoolNotOnline
        expr: nas_zpool_health{state!="ONLINE"} == 1
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.nas }} pool {{ $labels.pool }} is {{ $labels.state }}"}
      # snmp-build.py exposes status strings as a label named after the
      # metric (value 1). Which strings are healthy is the qnap adapter's
      # (adapters/nas/qnap/adapter.yaml, status:); render turns that into
      # the nas:*:ok recording rules in rules/status.yml, 1 when healthy
      # and 0 otherwise, with every label of the source series kept.
      - alert: NasDiskNotGood
        expr: nas:qnap_disk_status:ok == 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.nas }} disk {{ $labels.diskIndex }} {{ $labels.diskModel }} is {{ $labels.qnap_disk_status }}"}
      - alert: NasPoolStatusNotReady
        expr: nas:qnap_pool_status_info:ok == 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.nas }} pool {{ $labels.storagepoolID }} is {{ $labels.qnap_pool_status }}"}
      - alert: NasDiskHot
        expr: qnap_disk_temperature_celsius > ${nas_disk_temp_c}
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.nas }} disk {{ $labels.diskIndex }} at {{ $value }} °C for 15m"}
      - alert: NasSnapshotStale
        expr: (time() - nas_zfs_snapshot_newest_timestamp) > ${nas_snapshot_max_age_days} * 86400 and nas_zfs_snapshots > 0
        for: 1h
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.nas }} {{ $labels.dataset }} newest snapshot is {{ $value | humanizeDuration }} old"}
      # upsStatus is a free string in QTS-MIB. Both field NAS answer "-1",
      # which is what QuTS hero returns with no UPS attached, so -1 counts
      # as healthy in the status map. The healthy string of a connected UPS
      # has not been seen on this site yet; check it against the first walk
      # after one is plugged in.
      - alert: NasUpsNotOnline
        expr: nas:qnap_ups_status:ok == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.nas }} UPS reports {{ $labels.qnap_ups_status }}"}
      - alert: NasTelnetEnabled
        expr: nas:qnap_service_telnet_enabled_info:ok == 0
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.nas }} has Telnet enabled (a hardening regression)"}
      # Host memory fragmentation on a NAS with a GPU. The NVIDIA driver
      # needs physically contiguous blocks; when the Normal zone runs out
      # of high orders, restarting a GPU container fails with
      # NV_ERR_NO_MEMORY although MemFree is in the gigabytes. On the field
      # NAS that happened twice: once with every order from 7 up at 0, once
      # with order 10 at 0 and order 9 at 2. Empty high orders are a
      # precondition, not a certainty: containers have also restarted fine
      # in that state, so this is a warning to plan a reboot, not a page.
      # drop_caches plus compact_memory did not bring the blocks back; a
      # reboot did.
      #
      # What separates the two states on this host is whether any block of
      # order 7 (512 KiB) or larger is ever free. Order 9 and up, and the
      # share of free memory they hold, turned out to be too strict: on a
      # healthy host 2.4 hours after a reboot they sat at 0 whenever
      # ComfyUI had models loaded, idle included, and only came back when
      # the container was recreated. Order 7 and up also drop to 0 while a
      # job runs, but the same idle host still had 155 blocks of order 7
      # and 42 of order 8. The fragmented host (1.8 days up) had none from
      # order 6 up in any sample, idle or busy, and the first GPU failure
      # on record had none from order 7 up. Hence: no order 7+ block at any
      # point in 6 hours, with more than 1 GiB free (below that the counts
      # reflect usage, not fragmentation). Few data points; revisit as the
      # curve grows.
      - alert: NasMemoryFragmented
        expr: |
          max_over_time((sum by (nas) (nas_buddyinfo_free_blocks{zone="Normal",order=~"7|8|9|10"}))[6h:1m]) == 0
            and on (nas) nas_memory_free_bytes{zone="Normal"} > 1024 * 1024 * 1024
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.nas }} has had no free block of 512 KiB or larger in the Normal zone for 6h"
          runbook: "GPU containers may fail to start (NV_ERR_NO_MEMORY). Reboot the NAS in a quiet window before the next GPU container restart or upgrade"

  - name: pve
    rules:
      - alert: PveQuorumLost
        expr: min without (instance) (pve_up{id=~"cluster/.*"}) == 0
        labels: {severity: critical}
        annotations: {summary: "cluster {{ $labels.id }} not quorate, HA nodes will self-fence"}
      - alert: PveNodeOffline
        expr: max without (instance) (pve_up{id=~"node/.*"}) == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.id }} offline"}
      # From textfile/pve-quorum-textfile.sh, the metric form of
      # checks/qdevice/check.sh exit 1: quorate, but one more loss ends it.
      - alert: PveVoteMissing
        expr: pve_quorum_expected_votes - pve_quorum_total_votes > 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.cluster }} is missing {{ $value }} vote(s) but still quorate, nothing else may fail now (qdevice check.sh rc=1)"}
      - alert: PveQdeviceAbsent
        expr: pve_quorum_qdevice_votes == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.cluster }} QDevice is not voting (NAS reboot or qnetd down)"}
      - alert: PveQuorumUnreadable
        expr: pve_quorum_up == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "pve-quorum-textfile cannot read pvecm status for {{ $labels.cluster }} on any listed node (key, from= or node down)"}
      - alert: PveHaResourceError
        expr: max without (instance) (pve_ha_state{state=~"error|fence|recovery"}) == 1
        labels: {severity: critical}
        annotations: {summary: "HA resource {{ $labels.id }} in state {{ $labels.state }}"}
      - alert: PveStorageUnavailable
        expr: max without (instance) (pve_up{id=~"storage/.*"}) == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.id }} unavailable (NFS on the NAS?)"}
      - alert: PveReplicationFailing
        expr: max without (instance) (pve_replication_failed_syncs) > 0
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "replication {{ $labels.id }} has {{ $value }} failed syncs"}
      - alert: PveGuestLockedLong
        expr: max without (instance) (pve_lock_state{state!="suspended"}) == 1
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.id }} locked ({{ $labels.state }}) for 30m, a backup or migrate may be stuck"}

  - name: drills
    rules:
      - alert: DrillFailed
        expr: drill_last_result == 0
        labels: {severity: warning}
        annotations: {summary: "last {{ $labels.source }} drill {{ $labels.label }} failed"}
      - alert: DrillStale
        expr: (time() - drill_last_success_timestamp{source=~"pve|nas"}) > ${drill_max_age_days} * 86400
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.source }} drill {{ $labels.label }} last passed {{ $value | humanizeDuration }} ago, policy is ${drill_max_age_days} days"}
      - alert: CloudDrillStale
        expr: (time() - drill_last_success_timestamp{source="cloud"}) > ${cloud_drill_max_age_days} * 86400
        labels: {severity: warning}
        annotations: {summary: "cloud drill {{ $labels.label }} last passed {{ $value | humanizeDuration }} ago, policy is ${cloud_drill_max_age_days} days"}
      # The 900 s target is a PVE restore (the lab's first took 569 s). NAS and
      # cloud drill labels include uploads and whole-folder rollbacks with
      # their own scale, so the target applies to source="pve" only.
      - alert: DrillRtoOverTarget
        expr: drill_last_rto_seconds{source="pve"} > ${drill_rto_target_s}
        labels: {severity: info}
        annotations: {summary: "{{ $labels.source }} drill {{ $labels.label }} RTO {{ $value }} s, target ${drill_rto_target_s} s"}
