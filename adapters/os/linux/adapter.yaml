# Debian and Ubuntu hosts: the collector itself, nodes, the QDevice VM, the
# deadman host, and the OS side of a PVE node.
adapter: 1
kind: os
vendor: linux
version: 1
tested: ["Ubuntu 24.04", "Debian 13", "DGX OS 7"]
capabilities:
  journal:
    face: install
    status: implemented
    ref: logs/node/install-journal-upload.sh
  node_exporter:
    face: install
    status: implemented
    ref: collector/install-node.sh
  pcap:
    face: install
    status: implemented
    ref: logs/pcap/install-pcap.sh
  deadman:
    face: install
    status: implemented
    ref: collector/deadman/install-deadman.sh
