# QNAP NAS on QuTS hero. Contract: docs/adapters.md.
adapter: 1
kind: nas
vendor: qnap
version: 1
tested: ["QuTS hero 6.0.2"]
capabilities:
  facts:
    face: snmp
    status: implemented
    metrics: [qnap_firmware_info, qnap_model_info]
  health:
    face: collect
    status: implemented
    textfile: nas.prom
    note: pools, datasets, HBS and memory over one ssh session; disks, fans and UPS come from snmp_module
  snapshots:
    face: collect
    status: implemented
    textfile: nas.prom
    via: health
  share_canary:
    face: descriptor
    status: implemented
    ref: drills/nas-backup/share-canary.sh
  snmp_module:
    face: snmp
    status: implemented
    ref: collector/prometheus/snmp-build.py
    module: qnap
    metrics: [qnap_disk_status, qnap_pool_status_info, qnap_ups_status, qnap_service_telnet_enabled_info]
  syslog_profile:
    face: descriptor
    status: implemented
    ref: logs/nas/qulog-log-sender.md
# Status strings, as the field NAS report them (QuTS hero 6.0.2, first walk):
# disks "Good", pools "ready", Telnet "no", and the UPS "-1" when none is
# attached. render turns each entry into a recording rule <record> that is
# 1 when the string is healthy and 0 otherwise, keeping every label of the
# source series, and the alert compares that with 0. `ok` fails closed (a
# string nobody has seen yet raises the alert, which is the point); `bad`
# fails open (only the listed string raises it). Regexes are anchored, as
# PromQL anchors them; (?i) ignores case.
status:
  - {record: "nas:qnap_disk_status:ok", metric: qnap_disk_status, label: qnap_disk_status, ok: "(?i)good", alert: NasDiskNotGood}
  - {record: "nas:qnap_pool_status_info:ok", metric: qnap_pool_status_info, label: qnap_pool_status, ok: "ready", alert: NasPoolStatusNotReady}
  - {record: "nas:qnap_ups_status:ok", metric: qnap_ups_status, label: qnap_ups_status, ok: "(?i)online.*|-1", alert: NasUpsNotOnline}
  - {record: "nas:qnap_service_telnet_enabled_info:ok", metric: qnap_service_telnet_enabled_info, label: qnap_service_telnet_enabled, bad: "yes", alert: NasTelnetEnabled}
# Presence: whether a device is there at all, as opposed to how it is. A
# QNAP with no UPS reports the status "-1", which the status map above
# counts as healthy (nothing is wrong with a UPS that does not exist).
# render turns each entry into a recording rule <record>: 0 where the label
# matches `absent`, 1 otherwise. The record name carries no vendor, so
# another source (NUT) can feed the same alert. The alert stays quiet for a
# host that site.yaml marks ups: none (ops30_ups_none in 30ops-adapters.prom).
presence:
  - {record: "nas:ups:present", metric: qnap_ups_status, label: qnap_ups_status, absent: "-1", alert: NasUpsAbsent}
